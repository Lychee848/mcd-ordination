[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mcd-ordination"
version = "0.1.0"
description = "把麦当劳用户行为编译成一套专属麦门卡证（MCP 参赛作品）"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "mcd-ordination contributors"}]
keywords = ["mcp", "mcdonalds", "generative", "tcg", "麦门"]
dependencies = []

[project.optional-dependencies]
png = ["Pillow>=10.0"]

[project.scripts]
mcd-ordination = "mcd_ordination.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mcd_ordination = ["py.typed"]
